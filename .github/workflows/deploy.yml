name: Deploy CV

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cv-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check

      - name: Stage public site only
        if: github.event_name == 'push'
        run: mkdir -p _site && cp index.html _site/

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: _site

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: release-pdf
          path: resume.pdf
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - uses: actions/download-artifact@v8
        with:
          name: release-pdf

      # The GitHub plugin uploads the checked PDF only when creating a release.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install semantic-release

  deploy:
    name: Deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [build, release]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v4
      - uses: actions/deploy-pages@v4
        id: deployment
